<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order confirmed — Hibretfamily</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#10402f" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310402f'/%3E%3Ctext x='32' y='42' font-size='30' font-family='Georgia,serif' fill='%23d68a3a' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <svg style="display:none">
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="logo">Hibretfamily</a>
    </div>
  </header>

  <main id="main">
    <section class="success-page">
      <div class="success-page__icon"><svg class="icon"><use href="#icon-check"></use></svg></div>
      <p class="eyebrow">Order confirmed</p>
      <h1 class="success-page__welcome">
        <span lang="ti">የቐንየልና</span>
        <span class="cta-divider" aria-hidden="true">/</span>
        <span>Thank You</span>
      </h1>
      <p id="success-summary" class="success-page__summary">Loading your order…</p>

      <div id="success-items" class="success-page__items"></div>

      <a href="index.html" class="btn btn--primary">Continue shopping</a>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__bottom">
      <p>© <span id="current-year"></span> Hibretfamily. All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="js/success.js"></script>
  <script type="module" src="js/contact-widget.js"></script>
</body>
</html>
