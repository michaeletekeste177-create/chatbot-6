<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Your Order — Hibretfamily</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#10402f" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310402f'/%3E%3Ctext x='32' y='42' font-size='30' font-family='Georgia,serif' fill='%23d68a3a' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="logo">Hibretfamily</a>
      <nav class="nav" aria-label="Primary">
        <a href="index.html">Shop</a>
        <a href="sell.html">Sell With Us</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="section" id="order-lookup">
      <div class="section__header" data-reveal>
        <p class="eyebrow">Order history</p>
        <h1>Track your order</h1>
        <p class="section__subtitle">Enter the email you used at checkout to see your past orders.</p>
      </div>

      <form id="lookup-form" class="seller-form" style="max-width: 480px; margin: 0 auto var(--space-8);">
        <label>
          <span>Email</span>
          <input type="email" name="email" required autocomplete="email" placeholder="you@example.com" />
        </label>
        <button class="btn btn--accent" type="submit">Find my orders</button>
        <p class="state-message" id="lookup-state" hidden></p>
      </form>

      <div id="order-list" class="dashboard-products"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__bottom">
      <p>© <span id="current-year"></span> Hibretfamily. All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="js/orders-lookup.js"></script>
  <script type="module" src="js/contact-widget.js"></script>
</body>
</html>
